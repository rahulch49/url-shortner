name: Docker CI

on: 
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.job
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable and prepare pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Build API Docker image
        working-directory: services/api-service
        run: docker build -t api-service .

      - name: Build Redirect Docker image
        working-directory: services/redirect-service
        run: docker build -t redirect-service .